<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="akBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>
    <linearGradient id="akStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <filter id="akShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Cute Rounded Square Container -->
  <rect width="100" height="100" rx="26" fill="url(#akBgGrad)" filter="url(#akShadow)"/>
  
  <!-- Subtle Background Shine Circle -->
  <circle cx="50" cy="50" r="42" fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- Adorable Shopping Cart Body / Mascot -->
  <g transform="translate(0, 2)">
    <!-- Cart Handles / Ears -->
    <path d="M22 36 C18 36 16 30 19 25 C22 20 28 24 26 30" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M78 36 C82 36 84 30 81 25 C78 20 72 24 74 30" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Cute Cart Basket Main Shape -->
    <path d="M23 34 H77 C77 34 74 62 68 66 C62 70 38 70 32 66 C26 62 23 34 23 34 Z" fill="#FFFFFF"/>

    <!-- AK Monogram on Basket (Cute & Bold) -->
    <path d="M36 58 L42 42 L48 58 M38 52 H46" stroke="#FF5252" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M54 42 V58 M63 42 L55 50 L64 58" stroke="#FF5252" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Kawaii Face on Top Front of Basket -->
    <!-- Left Eye with Sparkle -->
    <circle cx="37" cy="32" r="4.5" fill="#1E293B"/>
    <circle cx="35.5" cy="30.5" r="1.8" fill="#FFFFFF"/>
    <circle cx="38.5" cy="33.5" r="0.9" fill="#FFFFFF"/>

    <!-- Right Eye with Sparkle -->
    <circle cx="63" cy="32" r="4.5" fill="#1E293B"/>
    <circle cx="61.5" cy="30.5" r="1.8" fill="#FFFFFF"/>
    <circle cx="64.5" cy="33.5" r="0.9" fill="#FFFFFF"/>

    <!-- Cute Rosy Blush Cheeks -->
    <ellipse cx="30" cy="36" rx="3.5" ry="2.2" fill="#FF85A1"/>
    <ellipse cx="70" cy="36" rx="3.5" ry="2.2" fill="#FF85A1"/>

    <!-- Happy Open Smile Mouth -->
    <path d="M45 35 Q50 41 55 35" stroke="#1E293B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M47 37 Q50 41 53 37" fill="#FF5252"/>

    <!-- Cute Little Cart Wheels -->
    <circle cx="36" cy="74" r="5.5" fill="#FFFFFF"/>
    <circle cx="36" cy="74" r="2.5" fill="#FF5252"/>
    <circle cx="64" cy="74" r="5.5" fill="#FFFFFF"/>
    <circle cx="64" cy="74" r="2.5" fill="#FF5252"/>
  </g>

  <!-- Little Sparkle Star Magic -->
  <path d="M82 18 L84 23 L89 25 L84 27 L82 32 L80 27 L75 25 L80 23 Z" fill="url(#akStarGrad)"/>
  <circle cx="18" cy="20" r="2" fill="#FFFFFF" opacity="0.8"/>
</svg>
